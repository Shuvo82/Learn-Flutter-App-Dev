<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-label="The Flutter layout rule">
<rect x="0.5" y="0.5" width="759" height="261" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">The Flutter layout rule</text>
<text x="24.0" y="51.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Constraints go down. Sizes go up. Parent sets position.</text>
<rect x="50.0" y="78.0" width="190.0" height="46.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="145.0" y="105.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Parent</text>
<rect x="50.0" y="196.0" width="190.0" height="46.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.5"/>
<text x="145.0" y="223.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Child</text>
<line x1="100.0" y1="124.0" x2="100.0" y2="190.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<polygon points="100.0,196.0 95.9,187.5 104.1,187.5" fill="#2a78d6" stroke="#2a78d6" stroke-width="1" stroke-linejoin="round"/>
<line x1="190.0" y1="196.0" x2="190.0" y2="130.0" stroke="#16996a" stroke-width="2" stroke-linecap="round"/>
<polygon points="190.0,124.0 194.1,132.5 185.9,132.5" fill="#16996a" stroke="#16996a" stroke-width="1" stroke-linejoin="round"/>
<circle cx="100.0" cy="160.0" r="9.5" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="100.0" y="164.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="190.0" cy="160.0" r="9.5" fill="#16996a" stroke="none" stroke-width="1.5"/>
<text x="190.0" y="164.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="50.0" cy="196.0" r="9.5" fill="#6250d6" stroke="none" stroke-width="1.5"/>
<text x="50.0" y="200.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="292.0" cy="92.0" r="9.5" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="292.0" y="96.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="312.0" y="96.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" text-anchor="start">Constraints go down</text>
<text x="312.0" y="115.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The parent gives min and max width and height: &quot;at most 300 × 200&quot;.</text>
<circle cx="292.0" cy="150.0" r="9.5" fill="#16996a" stroke="none" stroke-width="1.5"/>
<text x="292.0" y="154.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="312.0" y="154.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" text-anchor="start">Sizes go up</text>
<text x="312.0" y="173.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The child picks a size inside those limits: &quot;I will be 120 × 40&quot;.</text>
<circle cx="292.0" cy="208.0" r="9.5" fill="#6250d6" stroke="none" stroke-width="1.5"/>
<text x="292.0" y="212.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="312.0" y="212.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" text-anchor="start">Parent sets position</text>
<text x="312.0" y="231.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">The parent decides where the child sits: &quot;you go at (90, 80)&quot;.</text>
</svg>
