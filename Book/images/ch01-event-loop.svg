<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" role="img" aria-label="Dart runs one thing at a time: the event loop">
<rect x="0.5" y="0.5" width="759" height="423" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">Dart runs one thing at a time: the event loop</text>
<rect x="30.0" y="62.0" width="190.0" height="64.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="125.0" y="90.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Synchronous code</text>
<text x="125.0" y="106.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">runs first, to the end</text>
<rect x="285.0" y="62.0" width="190.0" height="64.0" rx="8" fill="#fdf2d3" stroke="#cf8d00" stroke-width="1.5"/>
<text x="380.0" y="90.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Microtask queue</text>
<text x="380.0" y="106.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">scheduleMicrotask, .then()</text>
<rect x="540.0" y="62.0" width="190.0" height="64.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.5"/>
<text x="635.0" y="90.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Event queue</text>
<text x="635.0" y="106.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">I/O, timers, taps, Future()</text>
<circle cx="30.0" cy="62.0" r="9.5" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="30.0" y="66.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="285.0" cy="62.0" r="9.5" fill="#cf8d00" stroke="none" stroke-width="1.5"/>
<text x="285.0" y="66.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="540.0" cy="62.0" r="9.5" fill="#16996a" stroke="none" stroke-width="1.5"/>
<text x="540.0" y="66.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<line x1="220.0" y1="94.0" x2="279.0" y2="94.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="285.0,94.0 276.5,98.1 276.5,89.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="252.5" y="88.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">then</text>
<line x1="475.0" y1="94.0" x2="534.0" y2="94.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="540.0,94.0 531.5,98.1 531.5,89.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="507.5" y="88.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">if empty</text>
<polyline points="635.0,126.0 635.0,150.0 380.0,150.0 380.0,132.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="380.0,126.0 384.1,134.5 375.9,134.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="507.0" y="166.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">after every event, empty the microtasks again</text>
<rect x="30.0" y="186.0" width="700.0" height="62.0" rx="8" fill="#f1f0ec" stroke="#d9d7d0" stroke-width="1"/>
<text x="380.0" y="210.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="11.5" font-weight="400" fill="#1c1c1a" text-anchor="middle">print(&#x27;1&#x27;);  Future(() =&gt; print(&#x27;2&#x27;));  scheduleMicrotask(() =&gt; print(&#x27;3&#x27;));  print(&#x27;4&#x27;);</text>
<text x="380.0" y="234.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">Output:  1  4  3  2      (sync code, then the microtask, then the event)</text>
<text x="24.0" y="284.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">Isolates: separate workers, each with its own memory</text>
<rect x="60.0" y="300.0" width="240.0" height="72.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="180.0" y="325.1" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Main isolate</text>
<text x="180.0" y="341.5" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">UI + event loop</text>
<text x="180.0" y="355.8" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">own memory</text>
<rect x="460.0" y="300.0" width="240.0" height="72.0" rx="8" fill="#ebe8fb" stroke="#6250d6" stroke-width="1.5"/>
<text x="580.0" y="325.1" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Worker isolate</text>
<text x="580.0" y="341.5" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">heavy work: parse JSON, images</text>
<text x="580.0" y="355.8" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">own memory</text>
<line x1="300.0" y1="322.0" x2="454.0" y2="322.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="460.0,322.0 451.5,326.1 451.5,317.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="380.0" y="316.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">message (SendPort)</text>
<line x1="460.0" y1="350.0" x2="306.0" y2="350.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="300.0,350.0 308.5,345.9 308.5,354.1" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="380.0" y="365.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">result</text>
<text x="380.0" y="400.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">Nothing is shared, so there are no locks and no race conditions.</text>
</svg>
