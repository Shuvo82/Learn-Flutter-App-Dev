<text x="380.0" y="103.5" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">hardware-backed,</text>
<text x="380.0" y="117.8" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">key cannot be extracted</text>
<rect x="540.0" y="66.0" width="190.0" height="64.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.5"/>
<text x="635.0" y="94.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">SQLCipher database</text>
<text x="635.0" y="110.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">AES-256 encrypted file</text>
<line x1="220.0" y1="98.0" x2="279.0" y2="98.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="285.0,98.0 276.5,102.1 276.5,93.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="252.5" y="92.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">stored in</text>
<line x1="475.0" y1="98.0" x2="534.0" y2="98.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="540.0,98.0 531.5,102.1 531.5,93.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="507.5" y="92.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">opens</text>
<text x="380.0" y="166.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">A copied database file is useless without the key.</text>
