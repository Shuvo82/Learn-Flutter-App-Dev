<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img" aria-label="How the local database is encrypted">
<rect x="0.5" y="0.5" width="759" height="195" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">How the local database is encrypted</text>
<rect x="30.0" y="66.0" width="190.0" height="64.0" rx="8" fill="#fdf2d3" stroke="#cf8d00" stroke-width="1.5"/>
<text x="125.0" y="94.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Random 256-bit key</text>
<text x="125.0" y="110.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">created on first run</text>
<rect x="285.0" y="66.0" width="190.0" height="64.0" rx="8" fill="#ebe8fb" stroke="#6250d6" stroke-width="1.5"/>
