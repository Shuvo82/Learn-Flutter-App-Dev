<text x="310.0" y="186.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">success: show and save</text>
<circle cx="210.0" cy="146.0" r="9.5" fill="#e0602c" stroke="none" stroke-width="1.5"/>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
