<text x="210.0" y="230.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<line x1="410.0" y1="254.0" x2="514.0" y2="254.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
