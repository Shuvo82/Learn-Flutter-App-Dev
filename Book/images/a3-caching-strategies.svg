<text x="465.0" y="168.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">only if it fails</text>
<rect x="520.0" y="146.0" width="216.0" height="56.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.5"/>
<text x="628.0" y="170.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Cache</text>
<text x="628.0" y="186.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">show the saved copy</text>
<circle cx="520.0" cy="146.0" r="9.5" fill="#16996a" stroke="none" stroke-width="1.5"/>
<text x="520.0" y="150.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="24.0" y="246.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1c1c1a" text-anchor="start">Stale-while-revalidate</text>
<text x="24.0" y="264.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">most list screens</text>
