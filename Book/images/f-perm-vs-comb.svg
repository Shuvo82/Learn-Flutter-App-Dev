<text x="200.0" y="236.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">AB ≠ BA (e.g. president + secretary)</text>
<text x="570.0" y="236.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">AB = BA (e.g. a team of two)</text>
<text x="200.0" y="274.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">nPr = n! ÷ (n − r)!</text>
<text x="200.0" y="296.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">3P2 = 3! ÷ 1! = 6</text>
<text x="570.0" y="274.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="13.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">nCr = n! ÷ (r! × (n − r)!)</text>
<text x="570.0" y="296.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">3C2 = 3! ÷ (2! × 1!) = 3</text>
