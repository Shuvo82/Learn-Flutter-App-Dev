<text x="300.0" y="182.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">ways</text>
<text x="690.0" y="160.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16996a" text-anchor="middle">3</text>
