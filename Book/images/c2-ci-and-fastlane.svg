<text x="42.0" y="96.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Decides WHEN to run (push, pull request, tag) and gives the machine.</text>
