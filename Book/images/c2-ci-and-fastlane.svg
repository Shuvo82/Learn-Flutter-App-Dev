<text x="123.0" y="154.7" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">flutter analyze</text>
<text x="123.0" y="168.3" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">flutter test</text>
