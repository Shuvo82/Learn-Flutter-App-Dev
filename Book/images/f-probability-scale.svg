<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="The probability scale: every probability is between 0 and 1">
<rect x="0.5" y="0.5" width="759" height="329" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">The probability scale: every probability is between 0 and 1</text>
<rect x="90.0" y="113.0" width="580.0" height="14.0" rx="7" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.2"/>
<circle cx="90.0" cy="120.0" r="7.0" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="90.0" y="102.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">0</text>
<text x="90.0" y="158.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Impossible</text>
<text x="90.0" y="174.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">a 7 on one die</text>
<circle cx="186.7" cy="120.0" r="7.0" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="186.7" y="102.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">1/6 ≈ 0.17</text>
<line x1="186.7" y1="129.0" x2="186.7" y2="196.0" stroke="#b9b7b0" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="186.7" y="210.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Unlikely</text>
<text x="186.7" y="226.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">a 6 on one die</text>
<circle cx="380.0" cy="120.0" r="7.0" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="102.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">1/2 = 0.5</text>
<text x="380.0" y="158.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Even chance</text>
<text x="380.0" y="174.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">heads on a coin</text>
<circle cx="670.0" cy="120.0" r="7.0" fill="#2a78d6" stroke="none" stroke-width="1.5"/>
<text x="670.0" y="102.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">1</text>
<text x="670.0" y="158.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Certain</text>
<text x="670.0" y="174.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">a number from 1 to 6</text>
<rect x="20.0" y="264.0" width="720.0" height="50.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.4"/>
<text x="380.0" y="285.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" text-anchor="middle">P(event) = favourable outcomes ÷ all equally likely outcomes</text>
<text x="380.0" y="304.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">P(not A) = 1 − P(A)  ·  the probabilities of all the outcomes add up to 1</text>
</svg>
