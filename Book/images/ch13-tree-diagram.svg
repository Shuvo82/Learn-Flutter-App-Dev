<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-label="A tree diagram: two balls drawn without replacement">
<rect x="0.5" y="0.5" width="759" height="391" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">A tree diagram: two balls drawn without replacement</text>
<text x="24.0" y="51.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The bag has 3 red and 2 blue balls. The first ball is not put back.</text>
<rect x="24.0" y="196.0" width="92.0" height="44.0" rx="8" fill="#f1f0ec" stroke="#8a8984" stroke-width="1.5"/>
<text x="70.0" y="214.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Bag</text>
<text x="70.0" y="230.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">3 R + 2 B</text>
<line x1="116.0" y1="218.0" x2="273.0" y2="136.0" stroke="#9a9892" stroke-width="1.6" stroke-linecap="round"/>
<text x="197.0" y="171.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d93f3e" text-anchor="middle">3/5</text>
<circle cx="290.0" cy="136.0" r="17.0" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.6"/>
<text x="290.0" y="141.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d93f3e" text-anchor="middle">R</text>
<line x1="307.0" y1="136.0" x2="483.0" y2="96.0" stroke="#9a9892" stroke-width="1.6" stroke-linecap="round"/>
<text x="395.0" y="108.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d93f3e" text-anchor="middle">2/4</text>
<circle cx="500.0" cy="96.0" r="17.0" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.6"/>
<text x="500.0" y="101.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d93f3e" text-anchor="middle">R</text>
<text x="530.0" y="94.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="start">3/5 × 2/4 = 6/20</text>
<text x="530.0" y="110.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">both red</text>
<line x1="307.0" y1="136.0" x2="483.0" y2="176.0" stroke="#9a9892" stroke-width="1.6" stroke-linecap="round"/>
<text x="395.0" y="174.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">2/4</text>
<circle cx="500.0" cy="176.0" r="17.0" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="500.0" y="181.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">B</text>
<text x="530.0" y="174.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="start">3/5 × 2/4 = 6/20</text>
<text x="530.0" y="190.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">red, then blue</text>
<text x="290.0" y="170.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7a7974" text-anchor="middle">then 2 R + 2 B left</text>
<line x1="116.0" y1="218.0" x2="273.0" y2="300.0" stroke="#9a9892" stroke-width="1.6" stroke-linecap="round"/>
<text x="197.0" y="277.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">2/5</text>
<circle cx="290.0" cy="300.0" r="17.0" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="290.0" y="305.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">B</text>
<line x1="307.0" y1="300.0" x2="483.0" y2="260.0" stroke="#9a9892" stroke-width="1.6" stroke-linecap="round"/>
<text x="395.0" y="272.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d93f3e" text-anchor="middle">3/4</text>
<circle cx="500.0" cy="260.0" r="17.0" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.6"/>
<text x="500.0" y="265.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#d93f3e" text-anchor="middle">R</text>
<text x="530.0" y="258.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="start">2/5 × 3/4 = 6/20</text>
<text x="530.0" y="274.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">blue, then red</text>
<line x1="307.0" y1="300.0" x2="483.0" y2="340.0" stroke="#9a9892" stroke-width="1.6" stroke-linecap="round"/>
<text x="395.0" y="338.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">1/4</text>
<circle cx="500.0" cy="340.0" r="17.0" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="500.0" y="345.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">B</text>
<text x="530.0" y="338.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="start">2/5 × 1/4 = 2/20</text>
<text x="530.0" y="354.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">both blue</text>
<text x="290.0" y="334.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#7a7974" text-anchor="middle">then 3 R + 1 B left</text>
<text x="380.0" y="380.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">Multiply ALONG a branch (AND). Add the ends you want (OR). All ends add up to 20/20 = 1.</text>
</svg>
