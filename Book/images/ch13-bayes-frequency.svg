<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-label="Conditional probability with counts: is a flagged build really bad?">
<rect x="0.5" y="0.5" width="759" height="383" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">Conditional probability with counts: is a flagged build really bad?</text>
<text x="24.0" y="51.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">2% of builds have a bug. The test catches 95% of bad builds, but also flags 10% of good ones.</text>
<rect x="24.0" y="172.0" width="120.0" height="52.0" rx="8" fill="#f1f0ec" stroke="#8a8984" stroke-width="1.5"/>
<text x="84.0" y="202.6" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1c1c1a" text-anchor="middle">1,000 builds</text>
<rect x="210.0" y="96.0" width="170.0" height="50.0" rx="8" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.5"/>
<text x="295.0" y="117.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">20 have a bug</text>
<text x="295.0" y="133.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">2% of 1,000</text>
<rect x="210.0" y="252.0" width="170.0" height="50.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.5"/>
<text x="295.0" y="273.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">980 are fine</text>
<text x="295.0" y="289.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">98% of 1,000</text>
<line x1="144.0" y1="176.1" x2="220.9" y2="148.1" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="226.5,146.0 219.9,152.7 217.1,145.1" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<line x1="144.0" y1="220.5" x2="222.6" y2="249.9" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="228.2,252.0 218.8,252.8 221.7,245.2" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="470.0" y="66.0" width="200.0" height="44.0" rx="8" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.5"/>
<text x="570.0" y="84.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">19 flagged</text>
<text x="570.0" y="100.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">95% of 20: true alarm</text>
<rect x="470.0" y="122.0" width="200.0" height="40.0" rx="8" fill="#ffffff" stroke="#b3b1aa" stroke-width="1.5"/>
<text x="570.0" y="146.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">1 missed</text>
<rect x="470.0" y="222.0" width="200.0" height="44.0" rx="8" fill="#fdeadf" stroke="#e0602c" stroke-width="1.5"/>
<text x="570.0" y="240.2" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">98 flagged</text>
<text x="570.0" y="256.7" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.0" font-weight="400" fill="#52514e" text-anchor="middle">10% of 980: false alarm</text>
<rect x="470.0" y="278.0" width="200.0" height="40.0" rx="8" fill="#ffffff" stroke="#b3b1aa" stroke-width="1.5"/>
<text x="570.0" y="302.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">882 not flagged</text>
<line x1="380.0" y1="110.8" x2="464.0" y2="100.7" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="470.0,100.0 462.0,105.1 461.1,97.0" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<line x1="380.0" y1="127.5" x2="464.0" y2="133.9" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="470.0,134.4 461.2,137.8 461.8,129.6" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<line x1="380.0" y1="266.8" x2="464.0" y2="256.7" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="470.0,256.0 462.0,261.1 461.1,253.0" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<line x1="380.0" y1="283.5" x2="464.0" y2="289.9" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="470.0,290.4 461.2,293.8 461.8,285.6" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="20.0" y="330.0" width="720.0" height="44.0" rx="8" fill="#fdf2d3" stroke="#cf8d00" stroke-width="1.4"/>
<text x="380.0" y="349.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Flagged = 19 + 98 = 117.  Really bad among them = 19.</text>
<text x="380.0" y="366.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#d93f3e" text-anchor="middle">P(bug | flagged) = 19 ÷ 117 ≈ 0.16 = 16%, not 95%!</text>
</svg>
