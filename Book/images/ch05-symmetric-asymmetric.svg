<text x="80.0" y="253.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1c1c1a" text-anchor="middle">Plain text</text>
<rect x="176.0" y="228.0" width="100.0" height="42.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
