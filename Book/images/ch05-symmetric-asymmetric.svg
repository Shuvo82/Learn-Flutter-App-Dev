<line x1="226.0" y1="270.0" x2="226.0" y2="288.0" stroke="#9a9892" stroke-width="1.2" stroke-linecap="round"/>
<line x1="534.0" y1="270.0" x2="534.0" y2="288.0" stroke="#9a9892" stroke-width="1.2" stroke-linecap="round"/>
<rect x="147.4" y="288.0" width="157.2" height="22.5" rx="11.25" fill="#e1f5ec" stroke="#16996a" stroke-width="1.2"/>
<text x="226.0" y="303.3" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">receiver&#x27;s PUBLIC key</text>
<rect x="452.2" y="288.0" width="163.7" height="22.5" rx="11.25" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.2"/>
<text x="534.0" y="303.3" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">receiver&#x27;s PRIVATE key</text>
<text x="380.0" y="336.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">Digital signature is the reverse: sign with the PRIVATE key, anyone verifies with the PUBLIC key.</text>
<text x="380.0" y="353.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">TLS uses both: asymmetric to agree on a key, then symmetric for the data.</text>
