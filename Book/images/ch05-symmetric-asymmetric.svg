<rect x="322.0" y="228.0" width="116.0" height="42.0" rx="8" fill="#f1f0ec" stroke="#8a8984" stroke-width="1.5"/>
<text x="380.0" y="253.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1c1c1a" text-anchor="middle">Cipher text</text>
<rect x="484.0" y="228.0" width="100.0" height="42.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="534.0" y="253.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Decrypt</text>
<rect x="630.0" y="228.0" width="100.0" height="42.0" rx="8" fill="#ffffff" stroke="#b3b1aa" stroke-width="1.5"/>
<text x="680.0" y="253.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1c1c1a" text-anchor="middle">Plain text</text>
<line x1="130.0" y1="249.0" x2="170.0" y2="249.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
