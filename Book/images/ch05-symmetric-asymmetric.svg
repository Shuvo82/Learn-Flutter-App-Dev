<rect x="307.8" y="150.0" width="144.4" height="22.5" rx="11.25" fill="#fdf2d3" stroke="#cf8d00" stroke-width="1.2"/>
<text x="380.0" y="165.3" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">the SAME secret key</text>
<text x="24.0" y="214.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1c1c1a" text-anchor="start">Asymmetric: a key pair (RSA). Slow.</text>
