<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" role="img" aria-label="Symmetric and asymmetric encryption">
<rect x="0.5" y="0.5" width="759" height="365" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
