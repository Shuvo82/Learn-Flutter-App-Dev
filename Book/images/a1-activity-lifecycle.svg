<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-label="Android Activity lifecycle">
<rect x="0.5" y="0.5" width="759" height="433" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">Android Activity lifecycle</text>
<rect x="300.0" y="64.0" width="160.0" height="34.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="380.0" y="85.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onCreate</text>
<text x="476.0" y="85.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">created: build the UI, initialise</text>
<rect x="300.0" y="114.0" width="160.0" height="34.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="380.0" y="135.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onStart</text>
<text x="476.0" y="135.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">becoming visible</text>
<line x1="380.0" y1="98.0" x2="380.0" y2="108.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="380.0,114.0 375.9,105.5 384.1,105.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="300.0" y="164.0" width="160.0" height="34.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="380.0" y="185.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onResume</text>
<text x="476.0" y="185.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">in front, takes input: start camera, sensors</text>
<line x1="380.0" y1="148.0" x2="380.0" y2="158.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="380.0,164.0 375.9,155.5 384.1,155.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="300.0" y="216.0" width="160.0" height="42.0" rx="8" fill="#e1f5ec" stroke="#16996a" stroke-width="1.5"/>
<text x="380.0" y="241.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Activity running</text>
<line x1="380.0" y1="198.0" x2="380.0" y2="210.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="380.0,216.0 375.9,207.5 384.1,207.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="300.0" y="280.0" width="160.0" height="34.0" rx="8" fill="#fdeadf" stroke="#e0602c" stroke-width="1.5"/>
<text x="380.0" y="301.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onPause</text>
<text x="476.0" y="301.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">losing focus: pause camera, save small data</text>
<line x1="380.0" y1="258.0" x2="380.0" y2="274.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="380.0,280.0 375.9,271.5 384.1,271.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="300.0" y="330.0" width="160.0" height="34.0" rx="8" fill="#fdeadf" stroke="#e0602c" stroke-width="1.5"/>
<text x="380.0" y="351.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onStop</text>
<text x="476.0" y="351.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">not visible: release heavy resources</text>
<line x1="380.0" y1="314.0" x2="380.0" y2="324.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="380.0,330.0 375.9,321.5 384.1,321.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="300.0" y="380.0" width="160.0" height="34.0" rx="8" fill="#fdeadf" stroke="#e0602c" stroke-width="1.5"/>
<text x="380.0" y="401.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onDestroy</text>
<text x="476.0" y="401.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">final clean-up (finish, or rotation)</text>
<line x1="380.0" y1="364.0" x2="380.0" y2="374.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="380.0,380.0 375.9,371.5 384.1,371.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<polyline points="300.0,297.0 262.0,297.0 262.0,181.0 294.0,181.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="300.0,181.0 291.5,185.1 291.5,176.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="254.0" y="236.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">back to</text>
<text x="254.0" y="250.3" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="end">the front</text>
<rect x="58.0" y="220.0" width="120.0" height="34.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="118.0" y="241.4" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">onRestart</text>
<polyline points="300.0,347.0 118.0,347.0 118.0,260.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="118.0,254.0 122.1,262.5 113.9,262.5" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<polyline points="118.0,220.0 118.0,131.0 294.0,131.0" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="300.0,131.0 291.5,135.1 291.5,126.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<text x="206.0" y="364.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">user returns to the app</text>
</svg>
