<text x="199.0" y="478.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">&quot;Rahim (sub 1098…) logged in at 10:02&quot;</text>
