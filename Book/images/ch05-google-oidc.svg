<text x="561.0" y="431.3" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">Access token  =  OAuth 2.0  =  WHAT?</text>
<text x="561.0" y="448.5" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">carries scopes: what the app may access</text>
<text x="561.0" y="463.5" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">sent as Bearer to an API (e.g. Google Drive)</text>
<text x="561.0" y="478.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">format not fixed: Google opaque, Keycloak JWT</text>
<text x="380.0" y="534.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1c1c1a" text-anchor="middle">Use the ID token to know the user. Use the access token to call APIs. Never swap them.</text>
</svg>
