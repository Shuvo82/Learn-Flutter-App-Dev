<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="How the work grows: n = 1,000 items, one step = 1 microsecond">
<rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">How the work grows: n = 1,000 items, one step = 1 microsecond</text>
<text x="24.0" y="51.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The bar length is drawn on a log scale; each grid line is 10 times more work.</text>
<line x1="270.0" y1="70.0" x2="270.0" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<line x1="323.3" y1="70.0" x2="323.3" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<line x1="376.7" y1="70.0" x2="376.7" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<line x1="430.0" y1="70.0" x2="430.0" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<line x1="483.3" y1="70.0" x2="483.3" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<line x1="536.7" y1="70.0" x2="536.7" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<line x1="590.0" y1="70.0" x2="590.0" y2="332.0" stroke="#ecebe6" stroke-width="1" stroke-linecap="round"/>
<text x="24.0" y="91.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">O(1)</text>
<text x="24.0" y="107.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">go straight to the seat number</text>
<rect x="270.0" y="82.0" width="10.0" height="24.0" rx="5" fill="#e1f5ec" stroke="#16996a" stroke-width="1.3"/>
<text x="290.0" y="92.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c1c1a" text-anchor="start">1 step</text>
<text x="290.0" y="107.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">1 µs</text>
<text x="24.0" y="135.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">O(log n)</text>
<text x="24.0" y="151.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">phone book: halve, halve, halve</text>
<rect x="270.0" y="126.0" width="53.3" height="24.0" rx="5" fill="#e1f5ec" stroke="#16996a" stroke-width="1.3"/>
<text x="333.3" y="136.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c1c1a" text-anchor="start">10 steps</text>
<text x="333.3" y="151.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">10 µs</text>
<text x="24.0" y="179.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">O(n)</text>
<text x="24.0" y="195.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">read the register from the top</text>
<rect x="270.0" y="170.0" width="160.0" height="24.0" rx="5" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.3"/>
<text x="440.0" y="180.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c1c1a" text-anchor="start">1,000 steps</text>
<text x="440.0" y="195.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">1 ms</text>
<text x="24.0" y="223.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">O(n log n)</text>
<text x="24.0" y="239.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">a good sort (merge sort)</text>
<rect x="270.0" y="214.0" width="213.3" height="24.0" rx="5" fill="#fdf2d3" stroke="#cf8d00" stroke-width="1.3"/>
<text x="493.3" y="224.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c1c1a" text-anchor="start">10,000 steps</text>
<text x="493.3" y="239.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">10 ms</text>
<text x="24.0" y="267.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">O(n²)</text>
<text x="24.0" y="283.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">everyone shakes hands with everyone</text>
<rect x="270.0" y="258.0" width="320.0" height="24.0" rx="5" fill="#fdeadf" stroke="#e0602c" stroke-width="1.3"/>
<text x="600.0" y="268.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1c1c1a" text-anchor="start">1,000,000 steps</text>
<text x="600.0" y="283.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">1 second</text>
<text x="24.0" y="311.0" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#1c1c1a" text-anchor="start">O(2ⁿ)</text>
<text x="24.0" y="327.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">try every on/off mix of n switches</text>
<rect x="270.0" y="302.0" width="350.0" height="24.0" rx="5" fill="#fde6e6" stroke="#d93f3e" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="445.0" y="318.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d93f3e" text-anchor="middle">2¹⁰⁰⁰ steps · never ends</text>
<rect x="20.0" y="340.0" width="720.0" height="48.0" rx="8" fill="#fdf2d3" stroke="#cf8d00" stroke-width="1.4"/>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Up to O(n log n) stays fast even for big lists.  O(n²) is slow for thousands of items.</text>
<text x="380.0" y="378.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">O(2ⁿ) only works when n is tiny (about 30 or less).</text>
</svg>
