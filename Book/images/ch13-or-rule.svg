<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-label="The OR rule: add, then subtract the overlap">
<rect x="0.5" y="0.5" width="759" height="335" rx="12" fill="#fcfcfb" stroke="#d9d7d0"/>
<text x="24.0" y="32.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1a" text-anchor="start">The OR rule: add, then subtract the overlap</text>
<text x="205.0" y="70.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" text-anchor="middle">Can happen together: subtract the overlap</text>
<circle cx="160.0" cy="184.0" r="78.0" fill="#fde6e6" fill-opacity="0.75" stroke="#d93f3e" stroke-width="1.6"/>
<circle cx="250.0" cy="184.0" r="78.0" fill="#e6f0fc" fill-opacity="0.75" stroke="#2a78d6" stroke-width="1.6"/>
<text x="120.0" y="98.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d93f3e" text-anchor="middle">Red cards (26)</text>
<text x="292.0" y="98.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">Kings (4)</text>
<text x="128.0" y="189.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">24</text>
<text x="205.0" y="182.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">2</text>
<text x="205.0" y="198.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">red kings</text>
<text x="285.0" y="189.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">2</text>
<text x="205.0" y="290.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">P(A or B) = P(A) + P(B) − P(A and B)</text>
<text x="205.0" y="310.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">P(red or king) = 26/52 + 4/52 − 2/52 = 28/52 = 7/13</text>
<line x1="400.0" y1="60.0" x2="400.0" y2="316.0" stroke="#d9d7d0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="580.0" y="70.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" text-anchor="middle">Mutually exclusive: just add</text>
<circle cx="510.0" cy="184.0" r="62.0" fill="#fdf2d3" fill-opacity="0.75" stroke="#cf8d00" stroke-width="1.6"/>
<circle cx="650.0" cy="184.0" r="62.0" fill="#e1f5ec" fill-opacity="0.75" stroke="#16996a" stroke-width="1.6"/>
<text x="510.0" y="180.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Kings</text>
<text x="510.0" y="198.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">4</text>
<text x="650.0" y="180.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">Queens</text>
<text x="650.0" y="198.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1c1a" text-anchor="middle">4</text>
<text x="580.0" y="268.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">no card is both</text>
<text x="580.0" y="290.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1c1a" text-anchor="middle">P(A or B) = P(A) + P(B)</text>
<text x="580.0" y="310.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">P(king or queen) = 4/52 + 4/52 = 8/52 = 2/13</text>
</svg>
