<rect x="326.0" y="150.0" width="156.0" height="44.0" rx="8" fill="#ebe8fb" stroke="#6250d6" stroke-width="1.5"/>
<text x="404.0" y="176.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">SHA-256 hash</text>
