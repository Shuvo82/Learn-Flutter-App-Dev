<text x="170.0" y="128.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Anyone can reverse it. It only changes the format, it hides nothing.</text>
