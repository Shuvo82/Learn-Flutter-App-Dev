<text x="404.0" y="260.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1c1c1a" text-anchor="middle">AES encrypt + key</text>
<line x1="482.0" y1="256.0" x2="514.0" y2="256.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="520.0,256.0 511.5,260.1 511.5,251.9" fill="#52514e" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/>
<rect x="520.0" y="234.0" width="216.0" height="44.0" rx="8" fill="#ffffff" stroke="#b3b1aa" stroke-width="1.5"/>
<text x="628.0" y="260.4" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1c1c1a" text-anchor="middle">unreadable ciphertext</text>
<text x="170.0" y="296.0" font-family="'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Reversed only by someone who holds the key. Used for data at rest and in transit.</text>
